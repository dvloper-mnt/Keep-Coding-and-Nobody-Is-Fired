name: Deploy

# La infraestructura AWS de este proyecto se destruyó el 2026-09-01, cuando
# terminó la hackathon (ver README → "La demo en vivo (y por qué está apagada)").
# Ya no existen el rol OIDC, el repositorio ECR ni el cluster ECS que usa este
# workflow, así que el trigger automático por push quedó desactivado: correría
# en cada merge a main solo para fallar.
#
# Se conserva como documentación del pipeline que sí desplegaba en producción.
# Para reactivarlo: `terraform apply` en infra/, recrear el secret
# AWS_DEPLOY_ROLE_ARN, y devolver el trigger `push` de abajo.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths-ignore:
  #     - '.kiro/**'
  #     - '**.md'
  #     - 'docs/**'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: keep-coding-game
  ECS_CLUSTER: keep-coding-game-cluster
  ECS_SERVICE: keep-coding-game

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and test
        run: |
          pnpm run lint
          pnpm run test

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          docker build --platform linux/amd64 -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Trigger ECS redeploy
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION"
